name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

# A newer push to the same branch or PR makes the running checks moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # data/evaluation.json, data/runs/ and data/quality/ are written only by the Evaluate catalog Action.
      - name: Generated data must not be edited in pull requests
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- data/evaluation.json data/runs data/quality)
          if [ -n "$changed" ]; then
            echo "::error::These files are generated by the Evaluate catalog Action and must not be changed in a PR:"
            echo "$changed"
            exit 1
          fi

      # On a PR, --base also requires each usedBy link the PR adds to show the use, not a site's front page.
      - name: Validate catalog (structure, duplicates, new usedBy links)
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/validate.mjs --base "origin/$BASE_REF" --report validation.md
          else
            node scripts/validate.mjs
          fi

      # The hooks a contributor runs locally (.pre-commit-config.yaml): the catalog against
      # data/catalog.schema.json, and both validators against tests/fixtures/.
      - name: Schema and validator tests (pre-commit)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Build site
        run: node scripts/build.mjs

      - name: Find changed entries
        if: github.event_name == 'pull_request'
        id: changed
        run: echo "ids=$(node scripts/changed-entries.mjs "origin/$BASE_REF")" >> "$GITHUB_OUTPUT"

      # Online checks: links resolve, DOIs exist and match, OLS ids are real.
      - name: Check links, DOIs and registry ids
        if: github.event_name == 'pull_request' && steps.changed.outputs.ids != ''
        env:
          ONLY: ${{ steps.changed.outputs.ids }}
        run: node scripts/validate.mjs --online --base "origin/$BASE_REF" --report validation.md

      - name: FAIR evaluation preview
        if: always() && github.event_name == 'pull_request' && steps.changed.outputs.ids != ''
        env:
          ONLY: ${{ steps.changed.outputs.ids }}
          NO_ARCHIVE: "1"
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/evaluate.mjs
          node scripts/score-report.mjs > evaluation.md

      # Without a report, "passed" is only true when every step before this one succeeded.
      - name: Write summary
        if: always() && github.event_name == 'pull_request'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            if [ -f validation.md ]; then cat validation.md
            elif [ "$JOB_STATUS" = success ]; then echo "### ✅ Catalog validation passed"
            else echo "### ❌ Checks failed"; fi
            if [ "$JOB_STATUS" != success ]; then printf '\n**Some checks failed; see the job log.**\n'; fi
            echo
            cat evaluation.md 2>/dev/null || true
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Comments need write access, which PRs from forks don't get; the job summary above always works.
      - name: Comment on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: neuroschema-checks
          path: comment.md
